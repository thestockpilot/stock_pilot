name: StockPilot CI

# Run the test suite automatically on every push and pull request.
on:
  push:
    branches: [main, claude]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # Backend: unit + integration tests (pytest), against a real
  # throwaway PostgreSQL spun up as a service container.
  # ---------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpilot_test
        ports:
          - 5432:5432
        # wait until Postgres is ready before the steps run
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # the app reads these from the environment (config.py)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/stockpilot_test
      SECRET_KEY: test-secret-key-for-ci-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run tests (unit + integration)
        working-directory: backend
        # -m "not network" skips tests marked as needing live external data;
        # those are covered by the fixtures described in the integration plan.
        run: uv run pytest -q -m "not network" --maxfail=1

  # ---------------------------------------------------------------
  # Frontend: make sure the React app still builds.
  # ---------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: Frontend
        run: npm install

      - name: Build
        working-directory: Frontend
        run: npm run build
