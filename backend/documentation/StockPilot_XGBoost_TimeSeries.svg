<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="710" viewBox="0 0 1560 710" font-family="Helvetica, Arial, sans-serif">
<rect width="1560" height="710" fill="white"/>
<text x="780.0" y="44" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">How XGBoost Works on Time-Series Stock Data</text>
<text x="780.0" y="72" font-size="13.5" text-anchor="middle" fill="#6B7280">The trick: reshape the price history into a spreadsheet — features look BACK, the label looks FORWARD</text>
<text x="50" y="136" font-size="15" font-weight="bold" fill="#1F2937">1.  Price history (a time-series)</text>
<rect x="50" y="150" width="430" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<polyline points="74,385 94,366 114,394 134,348 154,338 175,311 195,329 215,292 235,273 255,301 275,264 295,236 315,255 335,218 355,199 376,227 396,190 416,181 436,208 456,195" fill="none" stroke="#3B82F6" stroke-width="2.4"/>
<circle cx="315" cy="255" r="6" fill="#F59E0B" stroke="white" stroke-width="2"/>
<text x="315" y="442" font-size="10.5" text-anchor="middle" fill="#F59E0B" font-weight="bold">one day</text>
<line x1="175" y1="168" x2="315" y2="168" stroke="#10B981" stroke-width="2"/>
<text x="245" y="163" font-size="10.5" text-anchor="middle" fill="#10B981" font-weight="bold">FEATURES = recent past</text>
<line x1="315" y1="424" x2="416" y2="424" stroke="#EF4444" stroke-width="2"/>
<text x="366" y="420" font-size="10.5" text-anchor="middle" fill="#EF4444" font-weight="bold">LABEL = future move</text>
<text x="265.0" y="474" font-size="10.5" text-anchor="middle" fill="#6B7280">price goes up and down over days &rarr; time matters</text>
<line x1="488" y1="300.0" x2="538" y2="300.0" stroke="#374151" stroke-width="2.6"/>
<line x1="538" y1="300.0" x2="525.1051460839597" y2="294.5481432076789" stroke="#374151" stroke-width="2.6"/>
<line x1="538" y1="300.0" x2="525.1051460839597" y2="305.4518567923211" stroke="#374151" stroke-width="2.6"/>
<text x="513" y="288.0" font-size="10" text-anchor="middle" fill="#6B7280" font-style="italic">reshape</text>
<text x="560" y="136" font-size="15" font-weight="bold" fill="#1F2937">2.  Reshaped into a spreadsheet (what XGBoost sees)</text>
<rect x="560" y="150" width="70" height="34" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1"/>
<text x="595.0" y="171" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F2937">Day</text>
<rect x="630" y="150" width="62" height="34" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1"/>
<text x="661.0" y="171" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F2937">RSI</text>
<rect x="692" y="150" width="66" height="34" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1"/>
<text x="725.0" y="171" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F2937">MACD</text>
<rect x="758" y="150" width="88" height="34" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1"/>
<text x="802.0" y="171" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F2937">Volatility</text>
<rect x="846" y="150" width="44" height="34" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1"/>
<text x="868.0" y="171" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F2937">…</text>
<rect x="890" y="150" width="180" height="34" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1"/>
<text x="980.0" y="171" font-size="10" font-weight="bold" text-anchor="middle" fill="#1F2937">LABEL (5 days later)</text>
<rect x="560" y="184" width="70" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="595.0" y="205" font-size="10" text-anchor="middle" fill="#1F2937">Jan 02</text>
<rect x="630" y="184" width="62" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="661.0" y="205" font-size="10" text-anchor="middle" fill="#1F2937">32</text>
<rect x="692" y="184" width="66" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="725.0" y="205" font-size="10" text-anchor="middle" fill="#1F2937">-0.5</text>
<rect x="758" y="184" width="88" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="802.0" y="205" font-size="10" text-anchor="middle" fill="#1F2937">1.2</text>
<rect x="846" y="184" width="44" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="868.0" y="205" font-size="10" text-anchor="middle" fill="#1F2937">…</text>
<rect x="890" y="184" width="180" height="34" fill="#10B981" stroke="#94A3B8" stroke-width="1"/>
<text x="980.0" y="205" font-size="10" font-weight="bold" text-anchor="middle" fill="white">UP</text>
<rect x="560" y="218" width="70" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="595.0" y="239" font-size="10" text-anchor="middle" fill="#1F2937">Jan 03</text>
<rect x="630" y="218" width="62" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="661.0" y="239" font-size="10" text-anchor="middle" fill="#1F2937">45</text>
<rect x="692" y="218" width="66" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="725.0" y="239" font-size="10" text-anchor="middle" fill="#1F2937">0.2</text>
<rect x="758" y="218" width="88" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="802.0" y="239" font-size="10" text-anchor="middle" fill="#1F2937">1.1</text>
<rect x="846" y="218" width="44" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="868.0" y="239" font-size="10" text-anchor="middle" fill="#1F2937">…</text>
<rect x="890" y="218" width="180" height="34" fill="#EF4444" stroke="#94A3B8" stroke-width="1"/>
<text x="980.0" y="239" font-size="10" font-weight="bold" text-anchor="middle" fill="white">DOWN</text>
<rect x="560" y="252" width="70" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="595.0" y="273" font-size="10" text-anchor="middle" fill="#1F2937">Jan 04</text>
<rect x="630" y="252" width="62" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="661.0" y="273" font-size="10" text-anchor="middle" fill="#1F2937">58</text>
<rect x="692" y="252" width="66" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="725.0" y="273" font-size="10" text-anchor="middle" fill="#1F2937">0.6</text>
<rect x="758" y="252" width="88" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="802.0" y="273" font-size="10" text-anchor="middle" fill="#1F2937">0.9</text>
<rect x="846" y="252" width="44" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="868.0" y="273" font-size="10" text-anchor="middle" fill="#1F2937">…</text>
<rect x="890" y="252" width="180" height="34" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1"/>
<text x="980.0" y="273" font-size="10" font-weight="bold" text-anchor="middle" fill="#6B7280">(dropped: &lt;1%)</text>
<rect x="560" y="286" width="70" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="595.0" y="307" font-size="10" text-anchor="middle" fill="#1F2937">Jan 05</text>
<rect x="630" y="286" width="62" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="661.0" y="307" font-size="10" text-anchor="middle" fill="#1F2937">40</text>
<rect x="692" y="286" width="66" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="725.0" y="307" font-size="10" text-anchor="middle" fill="#1F2937">-0.1</text>
<rect x="758" y="286" width="88" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="802.0" y="307" font-size="10" text-anchor="middle" fill="#1F2937">1.0</text>
<rect x="846" y="286" width="44" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="868.0" y="307" font-size="10" text-anchor="middle" fill="#1F2937">…</text>
<rect x="890" y="286" width="180" height="34" fill="#10B981" stroke="#94A3B8" stroke-width="1"/>
<text x="980.0" y="307" font-size="10" font-weight="bold" text-anchor="middle" fill="white">UP</text>
<rect x="560" y="320" width="70" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="595.0" y="341" font-size="10" text-anchor="middle" fill="#1F2937">… today</text>
<rect x="630" y="320" width="62" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="661.0" y="341" font-size="10" text-anchor="middle" fill="#1F2937">61</text>
<rect x="692" y="320" width="66" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="725.0" y="341" font-size="10" text-anchor="middle" fill="#1F2937">0.3</text>
<rect x="758" y="320" width="88" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="802.0" y="341" font-size="10" text-anchor="middle" fill="#1F2937">1.3</text>
<rect x="846" y="320" width="44" height="34" fill="white" stroke="#CBD5E1" stroke-width="1"/>
<text x="868.0" y="341" font-size="10" text-anchor="middle" fill="#1F2937">…</text>
<rect x="890" y="320" width="180" height="34" fill="#F59E0B" stroke="#94A3B8" stroke-width="1"/>
<text x="980.0" y="341" font-size="10" font-weight="bold" text-anchor="middle" fill="white">??? (predict this)</text>
<text x="700" y="380" font-size="11" text-anchor="middle" fill="#10B981" font-weight="bold">&#8593; these columns come from the PAST</text>
<text x="1090" y="380" font-size="11" text-anchor="middle" fill="#EF4444" font-weight="bold">&#8593; this comes from the FUTURE</text>
<text x="870.0" y="402" font-size="10.5" text-anchor="middle" fill="#6B7280">Each row is independent. XGBoost no longer sees "time" — just numbers &rarr; an answer.</text>
<line x1="1186" y1="270" x2="1232" y2="270" stroke="#374151" stroke-width="2.6"/>
<line x1="1232" y1="270" x2="1219.1051460839597" y2="264.5481432076789" stroke="#374151" stroke-width="2.6"/>
<line x1="1232" y1="270" x2="1219.1051460839597" y2="275.4518567923211" stroke="#374151" stroke-width="2.6"/>
<text x="1225" y="136" font-size="15" font-weight="bold" fill="#1F2937">3.  XGBoost</text>
<rect x="1225" y="150" width="285" height="150" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
<text x="1367.5" y="178" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#6D28D9">Learns the table</text>
<text x="1243" y="204" font-size="10.5" fill="#1F2937">"low RSI + rising MACD</text>
<text x="1243" y="224" font-size="10.5" fill="#1F2937">   → usually UP"</text>
<text x="1243" y="244" font-size="10.5" fill="#1F2937">"high volatility + high RSI</text>
<text x="1243" y="264" font-size="10.5" fill="#1F2937">   → usually DOWN"</text>
<text x="1367.5" y="296" font-size="9.5" text-anchor="middle" fill="#6B7280">team of small decision trees</text>
<line x1="1367.5" y1="300" x2="1367.5" y2="340" stroke="#374151" stroke-width="2.6"/>
<line x1="1367.5" y1="340" x2="1372.951856792321" y2="327.1051460839596" stroke="#374151" stroke-width="2.6"/>
<line x1="1367.5" y1="340" x2="1362.048143207679" y2="327.1051460839596" stroke="#374151" stroke-width="2.6"/>
<rect x="1225" y="342" width="285" height="96" rx="10" fill="#111827"/>
<text x="1367.5" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Predict today's row</text>
<text x="1367.5" y="394" font-size="15" font-weight="bold" text-anchor="middle" fill="#F59E0B">62% DOWN</text>
<text x="1367.5" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="#EF4444">&rarr;  SELL signal</text>
<rect x="50" y="512" width="1460" height="130" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6"/>
<text x="74" y="542" font-size="15" font-weight="bold" fill="#92400E">&#9888;  The catch: the model ignores time, but WE must not</text>
<text x="74" y="568" font-size="11.5" fill="#1F2937">&#8226;  XGBoost treats every row as independent — it has no idea which day came first. That is fine for LEARNING.</text>
<text x="74" y="588" font-size="11.5" fill="#1F2937">&#8226;  But when we TEST it, we must keep the rows in time order: train on OLDER rows, test on NEWER rows.</text>
<text x="74" y="608" font-size="11.5" fill="#1F2937">&#8226;  If we shuffled them, future days would leak into training and the model would “cheat” — giving a fake-high score (look-ahead leakage).</text>
<text x="74" y="628" font-size="11.5" fill="#1F2937">&#8226;  That is why StockPilot uses a chronological 80:20 split and walk-forward validation, never a random shuffle.</text>
<text x="780.0" y="686" font-size="13" text-anchor="middle" fill="#1F2937" font-weight="bold">Features summarise the PAST · the label is the FUTURE · XGBoost learns "numbers &rarr; up/down" · we split by time so we never peek ahead.</text>
</svg>