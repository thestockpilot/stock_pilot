<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1330" viewBox="0 0 1320 1330" font-family="Helvetica, Arial, sans-serif">
<rect width="1320" height="1330" fill="white"/>
<text x="660.0" y="46" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">StockPilot AI Layer &mdash; How It Works</text>
<text x="660.0" y="72" font-size="13" text-anchor="middle" fill="#6B7280">A beginner's map: from a stock symbol to a BUY / HOLD / SELL recommendation</text>
<rect x="540.0" y="96" width="240" height="50" rx="10" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="660.0" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="white">INPUT: a stock symbol</text>
<text x="660.0" y="138" font-size="10.5" text-anchor="middle" fill="white">e.g. "AAPL"</text>
<line x1="660.0" y1="146" x2="660.0" y2="178" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="178" x2="664.6730201077038" y2="166.94726807196537" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="178" x2="655.3269798922962" y2="166.94726807196537" stroke="#374151" stroke-width="2.4"/>
<rect x="430.0" y="178" width="460" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="660.0" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">1.  DataFetcher  —  get the data</text>
<text x="660.0" y="220" font-size="10.5" text-anchor="middle" fill="#1F2937">Downloads price history from Yahoo Finance.</text>
<text x="660.0" y="235" font-size="10.5" text-anchor="middle" fill="#1F2937">OHLCV = Open, High, Low, Close, Volume (per day)</text>
<line x1="660.0" y1="244" x2="660.0" y2="276" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="276" x2="664.6730201077038" y2="264.94726807196537" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="276" x2="655.3269798922962" y2="264.94726807196537" stroke="#374151" stroke-width="2.4"/>
<rect x="602.0" y="251.0" width="116" height="17" rx="4" fill="white"/>
<text x="660.0" y="263.5" font-size="9.5" text-anchor="middle" fill="#6B7280" font-style="italic">raw prices</text>
<rect x="430.0" y="288" width="460" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="660.0" y="310" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">2.  FeatureEngine  —  make clues</text>
<text x="660.0" y="330" font-size="10.5" text-anchor="middle" fill="#1F2937">Turns raw prices into 23 technical indicators.</text>
<text x="660.0" y="345" font-size="10.5" text-anchor="middle" fill="#1F2937">RSI, MACD, moving averages…  (called "features")</text>
<line x1="660.0" y1="354" x2="660.0" y2="386" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="386" x2="664.6730201077038" y2="374.94726807196537" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="386" x2="655.3269798922962" y2="374.94726807196537" stroke="#374151" stroke-width="2.4"/>
<rect x="602.0" y="361.0" width="116" height="17" rx="4" fill="white"/>
<text x="660.0" y="373.5" font-size="9.5" text-anchor="middle" fill="#6B7280" font-style="italic">features</text>
<rect x="430.0" y="398" width="460" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="660.0" y="420" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">3.  FinBERT  —  read the news mood</text>
<text x="660.0" y="440" font-size="10.5" text-anchor="middle" fill="#1F2937">Reads headlines, scores sentiment 0–100.</text>
<text x="660.0" y="455" font-size="10.5" text-anchor="middle" fill="#1F2937">No news? falls back to a volume (OBV) proxy.</text>
<line x1="660.0" y1="464" x2="360.0" y2="512" stroke="#374151" stroke-width="2.4"/>
<line x1="360.0" y1="512" x2="371.65220938792214" y2="514.8681032722026" stroke="#374151" stroke-width="2.4"/>
<line x1="360.0" y1="512" x2="370.17562381092677" y2="505.6394434159816" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="464" x2="960.0" y2="512" stroke="#374151" stroke-width="2.4"/>
<line x1="960.0" y1="512" x2="949.8243761890732" y2="505.6394434159816" stroke="#374151" stroke-width="2.4"/>
<line x1="960.0" y1="512" x2="948.3477906120779" y2="514.8681032722026" stroke="#374151" stroke-width="2.4"/>
<text x="660.0" y="492" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B7280">TWO INDEPENDENT BRAINS</text>
<rect x="100.0" y="512" width="470" height="250" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="335.0" y="534" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">BRAIN A  —  Six-Factor Engine</text>
<text x="335.0" y="556" font-size="11.5" text-anchor="middle" fill="#047857" font-style="italic">The EXPLAINABLE brain — it shows its reasoning</text>
<text x="130.0" y="578" font-size="11" fill="#1F2937">•  1. Sentiment  (news mood)</text>
<text x="130.0" y="600" font-size="11" fill="#1F2937">•  2. Momentum  (trending up?)</text>
<text x="130.0" y="622" font-size="11" fill="#1F2937">•  3. Valuation  (cheap or dear?)</text>
<text x="130.0" y="644" font-size="11" fill="#1F2937">•  4. Volatility  (how jumpy?)</text>
<text x="130.0" y="666" font-size="11" fill="#1F2937">•  5. Volume  (activity confirms?)</text>
<text x="130.0" y="688" font-size="11" fill="#1F2937">•  6. Growth  (company growing?)</text>
<text x="335.0" y="748" font-size="10.5" text-anchor="middle" fill="#6B7280">Scores 6 factors, applies your weights → verdict</text>
<rect x="750.0" y="512" width="470" height="250" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
<text x="985.0" y="534" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">BRAIN B  —  XGBoost Model</text>
<text x="985.0" y="556" font-size="11.5" text-anchor="middle" fill="#6D28D9" font-style="italic">The LEARNED brain — finds patterns by itself</text>
<text x="778.0" y="582" font-size="10.5" fill="#6D28D9">TRAIN:  study thousands of past days —</text>
<text x="778.0" y="606" font-size="10.5" fill="#1F2937">        “these indicators → price went UP/DOWN”</text>
<text x="778.0" y="630" font-size="10.5" fill="#6D28D9">PREDICT:  feed today’s indicators →</text>
<text x="778.0" y="654" font-size="10.5" fill="#1F2937">        outputs a probability (e.g. 62% DOWN)</text>
<text x="778.0" y="678" font-size="10.5" fill="#1F2937">It is a team of small decision trees, each</text>
<text x="778.0" y="702" font-size="10.5" fill="#1F2937">one fixing the previous one’s mistakes.</text>
<line x1="335.0" y1="762" x2="656.0" y2="812" stroke="#374151" stroke-width="2.4"/>
<line x1="656.0" y1="812" x2="645.7981704738054" y2="805.6815607687925" stroke="#374151" stroke-width="2.4"/>
<line x1="656.0" y1="812" x2="644.359746053999" y2="814.9162455439497" stroke="#374151" stroke-width="2.4"/>
<line x1="985.0" y1="762" x2="664.0" y2="812" stroke="#374151" stroke-width="2.4"/>
<line x1="664.0" y1="812" x2="675.640253946001" y2="814.9162455439497" stroke="#374151" stroke-width="2.4"/>
<line x1="664.0" y1="812" x2="674.2018295261946" y2="805.6815607687925" stroke="#374151" stroke-width="2.4"/>
<rect x="440.0" y="820" width="440" height="60" rx="10" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="660.0" y="842" font-size="14" font-weight="bold" text-anchor="middle" fill="white">OUTPUT: the recommendation</text>
<text x="660.0" y="862" font-size="10.5" text-anchor="middle" fill="white">BUY  /  HOLD  /  SELL   +   confidence 0–100%</text>
<line x1="660.0" y1="880" x2="660.0" y2="912" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="912" x2="664.6730201077038" y2="900.9472680719654" stroke="#374151" stroke-width="2.4"/>
<line x1="660.0" y1="912" x2="655.3269798922962" y2="900.9472680719654" stroke="#374151" stroke-width="2.4"/>
<rect x="360.0" y="912" width="600" height="74" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="660.0" y="934" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">SAFETY CHECK  —  Backtest</text>
<text x="660.0" y="954" font-size="10.5" text-anchor="middle" fill="#1F2937">“If I had followed these signals over the last 5 years,</text>
<text x="660.0" y="969" font-size="10.5" text-anchor="middle" fill="#1F2937">would I have made money?”  Simulates trades with real</text>
<text x="660.0" y="984" font-size="10.5" text-anchor="middle" fill="#1F2937">costs (fees, slippage). Reports return, win rate, Sharpe.</text>
<rect x="60" y="1020" width="1200" height="270" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/>
<text x="86" y="1050" font-size="15" font-weight="bold" fill="#1F2937">Beginner glossary &mdash; the words that trip people up</text>
<text x="86" y="1078" font-size="11" font-weight="bold" fill="#111827">Feature</text>
<text x="290" y="1078" font-size="11" fill="#1F2937">a clue/input the model uses (an indicator like RSI).</text>
<text x="86" y="1102" font-size="11" font-weight="bold" fill="#111827">Label / target</text>
<text x="290" y="1102" font-size="11" fill="#1F2937">the answer we want (did the price go UP or DOWN?).</text>
<text x="86" y="1126" font-size="11" font-weight="bold" fill="#111827">Training</text>
<text x="290" y="1126" font-size="11" fill="#1F2937">the model learning patterns from past examples.</text>
<text x="86" y="1150" font-size="11" font-weight="bold" fill="#111827">Prediction (inference)</text>
<text x="290" y="1150" font-size="11" fill="#1F2937">using the trained model on new, unseen data.</text>
<text x="86" y="1174" font-size="11" font-weight="bold" fill="#111827">Probability</text>
<text x="290" y="1174" font-size="11" fill="#1F2937">the model’s confidence, 0–100%.</text>
<text x="86" y="1198" font-size="11" font-weight="bold" fill="#111827">Accuracy</text>
<text x="290" y="1198" font-size="11" fill="#1F2937">how often the model is right.</text>
<text x="86" y="1222" font-size="11" font-weight="bold" fill="#111827">Walk-forward validation</text>
<text x="290" y="1222" font-size="11" fill="#1F2937">fair testing: train on the past, test on the future (no peeking).</text>
<text x="86" y="1246" font-size="11" font-weight="bold" fill="#111827">Backtest</text>
<text x="290" y="1246" font-size="11" fill="#1F2937">simulating the strategy on historical data to see if it works.</text>
<text x="86" y="1270" font-size="11" font-weight="bold" fill="#111827">OHLCV</text>
<text x="290" y="1270" font-size="11" fill="#1F2937">Open, High, Low, Close, Volume — a stock’s daily data.</text>
<text x="660.0" y="1316" font-size="11" text-anchor="middle" fill="#6B7280" font-style="italic">Remember: TWO brains — Six-Factor (explains why) + XGBoost (learned from history). A backtest checks it would have worked.</text>
</svg>