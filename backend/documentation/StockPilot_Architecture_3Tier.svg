<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Helvetica, Arial, sans-serif">
<rect width="1500" height="1000" fill="white"/>
<text x="750.0" y="42" font-size="21" font-weight="bold" text-anchor="middle" fill="#111827">StockPilot — Three-Tier System Architecture</text>
<text x="750.0" y="65" font-size="11.5" text-anchor="middle" fill="#6B7280">Thin client, application server, relational database, and one external market-data service.</text>
<rect x="300" y="92" width="800" height="244" rx="6" fill="#F5F6F8" stroke="#B6BCC6" stroke-width="1.4" stroke-dasharray="9,6"/>
<text x="318" y="116" font-size="12.5" font-weight="bold" fill="#6B7280" letter-spacing="1.2">PRESENTATION TIER</text>
<rect x="330" y="122" width="200" height="52" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="430.0" y="153.25" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Investor</text>
<line x1="430" y1="174" x2="430" y2="226" stroke="#111827" stroke-width="2"/>
<polygon points="430,226 423,215 437,215" fill="#111827"/>
<rect x="580" y="122" width="200" height="52" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="680.0" y="153.25" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Financial Analyst</text>
<line x1="680" y1="174" x2="680" y2="226" stroke="#111827" stroke-width="2"/>
<polygon points="680,226 673,215 687,215" fill="#111827"/>
<rect x="830" y="122" width="200" height="52" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="930.0" y="153.25" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Administrator</text>
<line x1="930" y1="174" x2="930" y2="226" stroke="#111827" stroke-width="2"/>
<polygon points="930,226 923,215 937,215" fill="#111827"/>
<rect x="400" y="226" width="600" height="92" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="700.0" y="269.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Web Browser  —  Client Application</text>
<text x="700.0" y="287.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">React 18 single-page application (Vite build)</text>
<text x="700.0" y="301.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">React Router · Chart.js · lightweight-charts · axios</text>
<rect x="300" y="376" width="800" height="320" rx="6" fill="#F5F6F8" stroke="#B6BCC6" stroke-width="1.4" stroke-dasharray="9,6"/>
<text x="318" y="400" font-size="12.5" font-weight="bold" fill="#6B7280" letter-spacing="1.2">APPLICATION TIER</text>
<rect x="392" y="404" width="616" height="272" rx="5" fill="white" stroke="#111827" stroke-width="2.2"/>
<text x="700" y="430" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827">Application Server  —  FastAPI on Uvicorn (ASGI)</text>
<rect x="412" y="444" width="278" height="98" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="551.0" y="489.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">REST API Layer</text>
<text x="551.0" y="507.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">15 routers under /api/v1</text>
<text x="551.0" y="521.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">Pydantic request / response models</text>
<rect x="710" y="444" width="278" height="98" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="849.0" y="489.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Security &amp; Access Control</text>
<text x="849.0" y="507.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">JWT access and refresh tokens</text>
<text x="849.0" y="521.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">bcrypt hashing · role-based access</text>
<rect x="412" y="558" width="278" height="98" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="551.0" y="603.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Business Logic Layer</text>
<text x="551.0" y="621.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">market data · technical indicators</text>
<text x="551.0" y="635.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">scoring · backtesting · marketplace</text>
<rect x="710" y="558" width="278" height="98" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="849.0" y="603.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Machine Learning Layer</text>
<text x="849.0" y="621.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">XGBoost prediction model</text>
<text x="849.0" y="635.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">FinBERT sentiment model</text>
<rect x="300" y="736" width="800" height="186" rx="6" fill="#F5F6F8" stroke="#B6BCC6" stroke-width="1.4" stroke-dasharray="9,6"/>
<text x="318" y="760" font-size="12.5" font-weight="bold" fill="#6B7280" letter-spacing="1.2">DATA TIER</text>
<rect x="460" y="766" width="480" height="126" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="700.0" y="819.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL 16  —  Relational Database</text>
<text x="700.0" y="837.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">Accessed through SQLAlchemy 2.0 async ORM over asyncpg</text>
<text x="700.0" y="851.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">Schema in third normal form · 11 tables</text>
<text x="700.0" y="865.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">Migrations version-controlled with Alembic</text>
<rect x="1160" y="486" width="280" height="110" rx="4" fill="white" stroke="#111827" stroke-width="1.8"/>
<text x="1300.0" y="531.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Yahoo Finance API</text>
<text x="1300.0" y="549.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">Accessed with the yfinance client</text>
<text x="1300.0" y="563.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">Price history, live quotes,</text>
<text x="1300.0" y="577.0" font-size="10.5" text-anchor="middle" fill="#111827" opacity="0.85">news headlines and fundamentals</text>
<text x="1300" y="620" font-size="10.5" text-anchor="middle" fill="#6B7280">External service — outside the system boundary</text>
<line x1="700" y1="318" x2="700" y2="404" stroke="#111827" stroke-width="2"/>
<polygon points="700,404 693,393 707,393" fill="#111827"/>
<polygon points="700,318 693,329 707,329" fill="#111827"/>
<rect x="710.0" y="347.0" width="180.20000000000002" height="15" fill="white"/>
<text x="716.0" y="359.0" font-size="10.5" fill="#111827">HTTPS  ·  JSON  ·  REST</text>
<line x1="700" y1="676" x2="700" y2="766" stroke="#111827" stroke-width="2"/>
<polygon points="700,766 693,755 707,755" fill="#111827"/>
<polygon points="700,676 693,687 707,687" fill="#111827"/>
<rect x="710.0" y="707.0" width="172.8" height="15" fill="white"/>
<text x="716.0" y="719.0" font-size="10.5" fill="#111827">SQL  ·  asyncpg driver</text>
<line x1="1008" y1="541" x2="1160" y2="541" stroke="#111827" stroke-width="2"/>
<polygon points="1160,541 1149,534 1149,548" fill="#111827"/>
<polygon points="1008,541 1019,534 1019,548" fill="#111827"/>
<rect x="1060.5" y="515.0" width="47.0" height="15" fill="white"/>
<text x="1084.0" y="527.0" font-size="10.5" text-anchor="middle" fill="#111827">HTTPS</text>
<text x="300" y="948" font-size="10.5" fill="#6B7280">The browser holds no business logic and never contacts the database or the external service directly; every request passes through the application server,</text>
<text x="300" y="964" font-size="10.5" fill="#6B7280">which authenticates it and authorises it against the caller's role before any data is read or written.</text>
</svg>