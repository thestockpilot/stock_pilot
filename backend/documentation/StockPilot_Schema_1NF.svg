<text x="46" y="1058" font-size="10.5" fill="#333">Atomic values only, no repeating groups, every relation has a key. But composite-key relations (HOLDING_USER_STOCK, LISTING_RATING) hold attributes that depend on only PART of the key -&gt; 2NF violation;</text>
<text x="46" y="1073" font-size="10.5" fill="#333">STRATEGY_LISTING holds owner_full_name / owner_email that depend on owner_id, a non-key attribute -&gt; 3NF violation.</text>
